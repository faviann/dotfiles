name: Update flake inputs

on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reclaim runner disk
        run: scripts/reclaim-runner-disk

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update and validate the tracked flake inputs
        id: update
        run: |
          scripts/update-flake-lock | tee "$RUNNER_TEMP/summary.txt"
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Publish the validated update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='automation/flake-inputs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- flake.lock
          git commit -m 'Update nixpkgs and home-manager'

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$branch:$remote_sha" \
              origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          {
            cat <<'BODY'
          Automated nixpkgs and home-manager update.

          Validation completed before publication:

          - the isolated `dotnet-nixpkgs` input did not move
          - only `flake.lock` changed
          - Home Manager activation package built
          - `nix flake check` passed

          Advanced inputs:

          ```
          BODY
            cat "$RUNNER_TEMP/summary.txt"
            printf '```\n'
          } >"$RUNNER_TEMP/body.md"

          pr_number="$(
            gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'Update nixpkgs and home-manager' \
              --body-file "$RUNNER_TEMP/body.md"
          fi
